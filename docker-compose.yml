services:
  postgres:
    image: postgres:17
    container_name: dms-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_district}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file or environment variable}
    ports:
      - "5432:5432"
    volumes:
      - dms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  dms_postgres_data:
